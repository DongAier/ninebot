<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLE 一键解锁工具</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f4f4f9; }
    button { padding: 15px 30px; font-size: 18px; border: none; border-radius: 8px; background: #007bff; color: white; cursor: pointer; }
    button:disabled { background: #ccc; }
    #log { margin-top: 20px; font-size: 14px; color: #555; white-space: pre-wrap; text-align: center; }
  </style>
</head>
<body>

  <button id="btn">连接并解锁车辆</button>
  <div id="log">等待操作...</div>

  <script>
    const btn = document.getElementById('btn');
    const log = document.getElementById('log');

    const SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
    const TX_UUID = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';

    function showLog(msg) {
      log.innerText = msg;
    }

    btn.addEventListener('click', async () => {
      // 检查浏览器是否支持 Web Bluetooth
      if (!navigator.bluetooth) {
        showLog('当前浏览器不支持蓝牙功能，请使用安卓 Chrome 浏览器并通过 HTTPS 打开。');
        return;
      }

      try {
        btn.disabled = true;
        showLog('正在搜索蓝牙设备...');

        // 必须用 acceptAllDevices: true 才能搜出不广播长 UUID 的车辆
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [SERVICE_UUID]
        });

        showLog('已选择设备，正在连接 GATT 服务...');
        const server = await device.gatt.connect();

        showLog('正在获取通信服务...');
        const service = await server.getPrimaryService(SERVICE_UUID);

        showLog('正在获取通信通道...');
        const characteristic = await service.getCharacteristic(TX_UUID);

        // 构造解锁 Hex 数据: 5aa5007057457776656e467a39
        const payload = new Uint8Array([
          0x5A, 0xA5, 0x00, 0x70, 0x57, 0x45, 0x77, 0x76, 0x65, 0x6E, 0x46, 0x7A, 0x39
        ]);

        showLog('正在发送第一条指令...');
        await characteristic.writeValue(payload);

        showLog('第一声“叮”，等待 2 秒确认...');
        setTimeout(async () => {
          try {
            await characteristic.writeValue(payload);
            showLog('第二声“叮”已发送，解锁流程完成！');
          } catch (err) {
            showLog('第二次确认发送失败: ' + err.message);
          } finally {
            btn.disabled = false;
          }
        }, 2000);

      } catch (err) {
        showLog('操作失败或已取消: ' + err.message);
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
